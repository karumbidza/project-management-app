name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client (lint · test · build · audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Client/package-lock.json
      - run: npm ci
      # Lint is informational for now — the repo has pre-existing lint debt that is
      # tracked separately and must not block the pipeline.
      - run: npm run lint
        continue-on-error: true
      - run: npm test
      - run: npm run build
      # Fail the build on a known HIGH+ vulnerability in a PRODUCTION dependency.
      - run: npm audit --omit=dev --audit-level=high

  server:
    name: Server (prisma · unit tests · audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server
    env:
      # Dummy values so `prisma generate` / module imports don't fail in CI.
      # Integration tests (which need a seeded DB) run in staging, not here.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      # DB-free, pure-logic unit tests (SLA math, clock crediting, scoring).
      - run: npm run test:unit
      # Fail the build on a known HIGH+ vulnerability in a PRODUCTION dependency.
      - run: npm audit --omit=dev --audit-level=high
